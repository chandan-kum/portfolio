services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: chandan-kumar-portfolio:latest
    container_name: chandan-portfolio
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
